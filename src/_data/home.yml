hero:
    title: Find and Fix Revenue Leaks in Your Growth Funnel
    textarea: Most SaaS and lead-generation companies have conversion problems they don't even know exist. I help you identify and solve them.
    button_text: "Book a free audit"
features:
    grid_1:
      title: Your Growth Engine Has Revenue Leaks
      textarea: |
            **You're driving traffic. You're getting leads. But revenue isn't growing as fast as it should be.**
            
            **The problem:** Hidden conversion bottlenecks are bleeding revenue out of your funnel.
            
            Website visitors don't convert to leads. Maybe your messaging doesn't resonate. Or, your pricing page confuses prospects. Or, your signup flow has friction points.

            If your SaaS offers a free trial — getting users to activate is difficult. Maybe your onboarding is overwhelming or too discrete. Users can't find value quickly. They abandon before experiencing your core benefit.

            If you don't have the data or insights to know where to act or the resources to fix it.

            **I can help.**
